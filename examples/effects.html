<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070914">
<title>Galería de efectos · UltraGame</title>
<style>
  :root { --bg: #070914; --panel: #0e1224; --panel2: #151b36; --line: #252e52; --text: #e7ebff; --muted: #9aa3c7; --accent: #7c8cff; --accent2: #ff6ad5; --good: #63e6be; }
  * { box-sizing: border-box; }

  body { min-height: 100vh; background: radial-gradient(900px 500px at 0% -10%, rgba(124, 140, 255, 0.2), transparent 60%), radial-gradient(700px 400px at 100% 0%, rgba(255, 106, 213, 0.14), transparent 60%), var(--bg); }
  a { color: #b4bfff; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; padding: 16px 18px 6px; max-width: 1360px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 22px; }
  header h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a, .btn { text-decoration: none; padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); background: var(--panel); font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover, .links a:hover { border-color: var(--accent); }
  .btn.primary { background: linear-gradient(135deg, #3b4bd8, #7c3aed); border-color: transparent; font-weight: 600; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 12px 18px 30px; max-width: 1360px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .stage-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 10; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #000; box-shadow: 0 20px 60px -30px rgba(124, 140, 255, 0.6); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar .sp { flex: 1; }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: 7px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #2b3470; color: #fff; }
  pre { margin: 0; background: #0a0d1c; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow: auto; font: 12.5px/1.5 ui-monospace, Consolas, monospace; color: #cdd5ff; }
  .panel { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; max-height: calc(100vh - 110px); overflow: hidden; }
  @media (max-width: 980px) { .panel { max-height: none; } }
  .panel h2 { margin: 0; font-size: 15px; padding: 12px 14px 8px; }
  .search { margin: 0 14px 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0a0d1c; color: var(--text); font: inherit; }
  .list { overflow: auto; padding: 0 8px 8px; flex: 1; min-height: 160px; }
  .cat { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; margin: 10px 6px 4px; }
  .fx { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: 9px; color: var(--text); font: inherit; padding: 6px 8px; cursor: pointer; }
  .fx:hover { background: rgba(124, 140, 255, 0.08); }
  .fx[aria-current="true"] { background: rgba(124, 140, 255, 0.16); border-color: rgba(124, 140, 255, 0.4); }
  .fx small { color: var(--muted); font-size: 11.5px; }
  .params { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; max-height: 45%; overflow: auto; }
  .params h3 { margin: 0; font-size: 14px; }
  .params p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .row { display: grid; grid-template-columns: 110px 1fr 54px; gap: 8px; align-items: center; font-size: 12.5px; }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  .row output { text-align: right; color: #cdd5ff; font-variant-numeric: tabular-nums; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; }
  .stack span { font-size: 12px; padding: 3px 8px; border-radius: 7px; background: rgba(255, 106, 213, 0.12); border: 1px solid rgba(255, 106, 213, 0.3); }
  label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  #status { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <div>
    <h1><span>UltraGame</span> · Galería de efectos</h1>
    <p>35 efectos con shaders GLSL (WebGL/WebGL2) y WGSL (WebGPU), y equivalente CSS en Canvas 2D. Todo es código: sin imágenes externas.</p>
  </div>
  <div class="links"><a href="../minigames/index.html">Minijuegos</a><a href="../docs/index.html">Documentación</a></div>
</header>
<main>
  <section class="stage-wrap">
    <div id="stage"></div>
    <div class="toolbar">
      <div class="seg" id="target" role="group" aria-label="Aplicar a">
        <button type="button" data-t="camera" aria-pressed="true">Escena (cámara)</button>
        <button type="button" data-t="object" aria-pressed="false">Solo el logo</button>
      </div>
      <label class="chk"><input type="checkbox" id="stackMode"> Apilar efectos</label>
      <span class="sp"></span>
      <button class="btn" id="compare" type="button" title="Mantén pulsado para ver sin efecto">Mantener: original</button>
      <button class="btn" id="clear" type="button">Quitar</button>
      <button class="btn primary" id="gif" type="button">Grabar GIF</button>
    </div>
    <div class="toolbar"><span id="status"></span><span class="sp"></span><div class="seg" id="rend" role="group" aria-label="Renderizador"></div></div>
    <pre id="code" aria-label="Código"></pre>
    <div class="toolbar" id="tools" hidden><button class="btn" id="genAll" type="button">Generar muestras en docs/media</button><span id="genLog"></span></div>
  </section>
  <aside class="panel">
    <h2>Efectos</h2>
    <input class="search" id="search" type="search" placeholder="Buscar efecto…" aria-label="Buscar efecto">
    <div class="list" id="list"></div>
    <div class="params" id="params"></div>
  </aside>
</main>
